name: Correct résumé credential status in published PDFs

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/relabel_resume_credentials.py"
      - ".github/workflows/relabel-resume.yml"

permissions:
  contents: write

jobs:
  correct-resume:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF editor
        run: python -m pip install "PyMuPDF>=1.26,<1.27"
      - name: Correct credential-status lines
        run: python scripts/relabel_resume_credentials.py
      - name: Commit corrected original PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Kacey-Day-Resume-2026.pdf Kacey-Day-Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Label completed training and pending credentials accurately in resume PDF"
            git push origin HEAD:main
          fi
