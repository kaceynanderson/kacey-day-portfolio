<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680"><rect width="620" height="680" fill="#0b1424"/><rect x="620" width="580" height="680" fill="#f7f8fa"/><text x="75" y="135" font-family="Arial" font-size="28" font-weight="700" fill="#fff">Every student deserves</text><text x="75" y="175" font-family="Arial" font-size="28" fill="#864cff">a clear path forward.</text><text x="75" y="235" font-family="Arial" font-size="20" fill="#b5bfce">One place to track progress, share notes,</text><text x="75" y="270" font-family="Arial" font-size="20" fill="#b5bfce">and stay aligned from first session to test day.</text><g transform="translate(735,145)"><rect width="365" height="390" rx="28" fill="#fff" stroke="#e2e6ec"/><text x="45" y="65" font-family="Arial" font-size="26" font-weight="700" fill="#162033">Welcome back</text><text x="45" y="98" font-family="Arial" font-size="16" fill="#9ba6b6">Sign in to your Lumavi account</text><rect x="45" y="145" width="275" height="52" rx="14" fill="#fff" stroke="#d9dee7"/><text x="65" y="178" font-family="Arial" font-size="15" fill="#253044">Continue with Google</text><rect x="45" y="245" width="275" height="48" rx="12" fill="#edf2fc"/><rect x="45" y="315" width="275" height="48" rx="12" fill="#edf2fc"/><rect x="45" y="375" width="275" height="52" rx="14" fill="url(#g)"/></g><defs><linearGradient id="g"><stop stop-color="#7653ff"/><stop offset="1" stop-color="#12b5d4"/></linearGradient></defs></svg>